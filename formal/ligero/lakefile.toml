name = "udr"
version = "0.1.0"
defaultTargets = ["Ligero.API"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "ReedSolomon"

[[lean_lib]]
name = "CodingTheory"

[[lean_lib]]
name = "AffineAgreement"

[[lean_lib]]
name = "CorrelatedAgreement"

[[lean_lib]]
name = "SelectedMCA"

[[lean_lib]]
name = "Ligero"

[[lean_lib]]
name = "examples"
